name: Build

# Packages one .vsix per VS Code platform target. The Copilot runtime ships as a
# platform-specific npm package (@github/copilot-sdk-<platform>), so each target
# installs its own runtime with npm's --os / --cpu / --libc overrides and is
# packaged with `vsce package --target`. Pushing a v* tag also publishes the
# packages to a GitHub release and, when the VSCE_PAT secret is set, to the
# VS Code Marketplace.

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --fetch-timeout=600000

      - name: Run test suite
        run: xvfb-run -a npm test

  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win32-x64, npm_flags: '--os=win32 --cpu=x64' }
          - { target: win32-arm64, npm_flags: '--os=win32 --cpu=arm64' }
          - { target: darwin-x64, npm_flags: '--os=darwin --cpu=x64' }
          - { target: darwin-arm64, npm_flags: '--os=darwin --cpu=arm64' }
          - { target: linux-x64, npm_flags: '--os=linux --cpu=x64 --libc=glibc' }
          - { target: linux-arm64, npm_flags: '--os=linux --cpu=arm64 --libc=glibc' }
          - { target: alpine-x64, npm_flags: '--os=linux --cpu=x64 --libc=musl' }
          - { target: alpine-arm64, npm_flags: '--os=linux --cpu=arm64 --libc=musl' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies for ${{ matrix.target }}
        run: npm ci --fetch-timeout=600000 ${{ matrix.npm_flags }}

      - name: Check the target's Copilot runtime is installed
        run: |
          count=$(find node_modules/@github -path '*/prebuilds/*/runtime.node' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one Copilot runtime, found $count:"
            find node_modules/@github -path '*/prebuilds/*/runtime.node'
            exit 1
          fi
          find node_modules/@github -path '*/prebuilds/*/runtime.node'

      - name: Package
        run: |
          mkdir -p vsix
          npx vsce package --target ${{ matrix.target }} --out vsix/navi-${{ matrix.target }}.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: navi-${{ matrix.target }}
          path: vsix/navi-${{ matrix.target }}.vsix
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 14 }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Azure DevOps PAT with Marketplace (Manage) scope. Global PATs are retired
      # on 2026-12-01; publishing is skipped when the secret is not set.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: vsix
          pattern: navi-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" vsix/*.vsix --title "Navi $GITHUB_REF_NAME" --generate-notes

      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@4 publish --packagePath vsix/*.vsix
